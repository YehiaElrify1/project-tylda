name: Deploy AVO Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "avo_website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static web bundle
        run: |
          mkdir -p _site
          cp -r avo_website/css _site/
          cp -r avo_website/js _site/
          cp -r avo_website/assets _site/
          rm -rf _site/assets/pptx_media
          cp avo_website/index.html _site/
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
